name: Quality

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate.
        required: false
        type: string
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '7.4'
          - '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP coding standards
        run: php vendor/bin/phpcs

      - name: Run portable runner and lifecycle proof syntax checks
        run: |
          npm run lint:runner
          php -l scripts/tests/lifecycle-local-proof.php
          php -l scripts/tests/lifecycle-proof-processes.php
          php -l scripts/tests/lifecycle-proof-cases.php
          php -l scripts/tests/consent-ledger-proof-processes.php
          php -l scripts/tests/consent-ledger-proof-cases.php
          php -l scripts/tests/consent-ledger-proof-races.php
          php -l scripts/tests/consent-ledger-proof-edges.php
          php -l scripts/tests/closed-provenance-proof-processes.php
          php -l scripts/tests/closed-provenance-proof-cases.php
          php -l scripts/tests/closed-provenance-proof-races.php
          php -l scripts/tests/closed-provenance-proof-edges.php
          php -l scripts/tests/closed-provenance-proof-requests.php
          php -l scripts/tests/lifecycle-proof-safety.php
          php -l scripts/tests/consent-auth-local-proof.php
          php -l scripts/tests/consent-auth-proof-storage.php
          php -l scripts/tests/consent-auth-proof-core.php
          php -l scripts/tests/consent-auth-proof-ports.php
          php -l scripts/tests/consent-auth-proof-cases.php
          php -l scripts/tests/consent-auth-proof-denials.php
          php -l scripts/tests/consent-auth-proof-guards.php
          php -l scripts/tests/consent-auth-proof-receipts.php
          for file in scripts/tests/closed-writer-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/admission-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/fixed-core-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/native-observer-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/native-closed-begin-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/native-paired-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/native-scan-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-native-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-admission-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-observation-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-handoff-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-barrier-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-contention-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-lifecycle-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-outcome-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/registration-join-proof-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/relay-no-fault-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/owned-stdio-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/owned-stdio-*.mjs; do node --check "$file" || exit 1; done
          for file in scripts/tests/observation-*.mjs; do node --check "$file" || exit 1; done
          for file in scripts/tests/observation-*.php; do php -l "$file" || exit 1; done
          # Syntax only: the owned native experiment requires separate local approval.
          for file in scripts/tests/selected-native-*.mjs; do node --check "$file" || exit 1; done
          for file in scripts/tests/selected-native-*.php; do php -l "$file" || exit 1; done
          # Syntax only; this no-fault native proof requires exact local target approval.
          for file in scripts/tests/qualification-native-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/qualification-native-*.mjs; do node --check "$file" || exit 1; done
          # Syntax only: selected qualification execution stays separately local-approved.
          for file in scripts/tests/selected-qualification-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/selected-qualification-*.mjs; do node --check "$file" || exit 1; done
          # Syntax only: genuine-core/native proof still requires exact local target approval.
          for file in scripts/tests/native-lifecycle-proof-*.php; do php -l "$file" || exit 1; done
          # Socket-free foundation syntax only; never starts a native/private-channel proof.
          for file in scripts/tests/native-qualification-*.php; do php -l "$file" || exit 1; done
          for file in scripts/tests/native-qualification-*.mjs; do node --check "$file" || exit 1; done

      - name: Run PHPUnit
        run: php vendor/bin/phpunit --do-not-cache-result

  node:
    name: Node build and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Verify development watcher
        run: npm run test:dev-tools

      - name: Build production assets
        run: npm run build

      - name: Verify deterministic runner build
        run: npm run verify:runner

      - name: Verify generated assets are current
        run: git diff --exit-code -- assets/admin.js assets/admin-workspaces.js assets/admin.css server-runner/alynt-backup-runner.php

      - name: Audit Node dependencies
        run: npm audit --audit-level=high
